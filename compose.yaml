name: case-intelligence-ai

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - agent-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - agent-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-postgres:
  agent-valkey:
